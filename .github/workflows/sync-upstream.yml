name: Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *'   # every day at 2:00 AM UTC
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/thClaws/thClaws.git
          git fetch upstream main

      - name: Check for differences
        id: diff
        run: |
          COUNT=$(git rev-list HEAD..upstream/main --count)
          echo "ahead=$COUNT" >> $GITHUB_OUTPUT

      - name: Sync, open PR, and auto-merge
        if: steps.diff.outputs.ahead != '0'
        run: |
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          git checkout -b $BRANCH upstream/main
          git push origin $BRANCH --force

          gh pr create \
            --base main \
            --head $BRANCH \
            --title "chore: sync upstream $(date +%Y-%m-%d)" \
            --body "Automated daily sync from [thClaws/thClaws](https://github.com/thClaws/thClaws) main branch." \
            --label "sync,automated" \
          && gh pr merge $BRANCH --merge --auto --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
