name: Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/thClaws/thClaws.git
          git fetch upstream main

      - name: Check for differences
        id: diff
        run: |
          COUNT=$(git rev-list HEAD..upstream/main --count)
          echo "Commits behind upstream: $COUNT"
          echo "ahead=$COUNT" >> $GITHUB_OUTPUT

      - name: Merge upstream into main
        if: steps.diff.outputs.ahead != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge upstream/main --no-ff -m "chore: sync upstream $(date +%Y-%m-%d)"
          git push origin main
